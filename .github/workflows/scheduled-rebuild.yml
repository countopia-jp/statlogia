name: Scheduled Rebuild

on:
  schedule:
    # 月2回、JST 2日と17日の 03:00 にビルドし直す（10-23 月2回に）。
    # cron は UTC なので、UTC 1日18:00 → JST 2日03:00、UTC 16日18:00 → JST 17日03:00。
    # 夜中に回すのは e-Stat が空いている時間に取りたいため
    - cron: '0 18 1 * *'
    - cron: '0 18 16 * *'
  workflow_dispatch: {}  # 手動でも実行できるようにしておく

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trigger empty commit to redeploy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: scheduled rebuild (data refresh)"
          git push
