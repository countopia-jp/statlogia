name: Scheduled Rebuild

on:
  schedule:
    # 毎月1日と16日の 03:00 JST（UTC 18:00 前日）にビルドし直す（10-23 月2回に）
    - cron: '0 18 1 * *'
    - cron: '0 18 16 * *'
  workflow_dispatch: {}  # 手動でも実行できるようにしておく

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trigger empty commit to redeploy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: scheduled rebuild (data refresh)"
          git push
