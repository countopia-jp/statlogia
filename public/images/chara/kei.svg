    <path d="M41 44 Q44 47 47 44" stroke="#1E3A2F" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <path d="M53 44 Q56 47 59 44" stroke="#1E3A2F" stroke-width="1.8" fill="none" stroke-linecap="round"/>
