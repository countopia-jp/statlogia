    <path d="M50 16 L42 10 L44 20 Z" fill="#B3402A"/>
    <path d="M50 16 L58 10 L56 20 Z" fill="#B3402A"/>
    <circle cx="50" cy="16" r="2.6" fill="#8E3122"/>
